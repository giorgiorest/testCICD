name: Saluta
description: Saluta qualcuno
inputs:
   nome:
      description: 'Nome'
      required: true
      default: 'Mondo'
outputs:
    saluto:
        description: Saluto ${{ steps.s.outputs.saluto }}
runs:
   using: 'composite'
   steps:
      - id: s
        shell: bash
        env:
           NOME: ${{ inputs.nome }}
        run: echo "saluto=Ciao $NOME" >> "$GITHUB_OUTPUT"