name: Collegamento Job e gestione fallimento
on:
   workflow_dispatch:
jobs:
   versione:
      runs-on: ubuntu-latest
      outputs:
         version: ${{ steps.set-version.outputs.v }}
      steps:
         - id: set-version
           run: echo "v=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"  
   build:
      runs-on: ubuntu-latest
      needs: [versione]
      steps:
         - run: echo "Build in corso per la versione ${{ needs.versione.outputs.version }}"
         - run: exit 1
   allarme:
      runs-on: ubuntu-latest
      if: failure()
      needs: [build]
      steps:
         - run: echo "Build fallita per la versione. Inviare allarme al team di sviluppo"