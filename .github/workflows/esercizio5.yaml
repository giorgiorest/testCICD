name: 5 Matrice
on:
   workflow_dispatch:
jobs:
   prova-matrice:
      runs-on: ${{matrix.os}}
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-latest, windows-latest]
            java: [17, 21]
            exclude:
               - os: windows-latest
                 java: 17
      steps:
         - uses: actions/setup-java@v3
           with:
              distribution: 'temurin'
              java-version: ${{ matrix.java }}
         - run: java -version
         - if: ${{ matrix.os == 'windows-latest' && matrix.java == 21 }}
           run: exit 1